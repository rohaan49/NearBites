[project]
name = "nearbites-api"
version = "0.1.0"
description = "NearBites FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2",
  "pydantic[email]>=2.10",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.9",
  "alembic>=1.14",
  "python-multipart>=0.0.20",
  "pillow>=11.0",
  "ultralytics==8.4.164",
]

[tool.uv]
package = false
